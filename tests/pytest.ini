# Lives in tests/ so the rootdir is tests/: inside ComfyUI/custom_nodes this keeps
# pytest off ComfyUI's pytest.ini, and the repo root's __init__.py never gets
# imported as a package (it can't be when the folder name has hyphens).
[pytest]
markers =
    gpu: needs CUDA and a real MiniMax H3 latent upscaler checkpoint in latent_upscale_models
